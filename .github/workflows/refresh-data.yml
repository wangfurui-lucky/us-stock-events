name: Daily US Market Data Refresh

on:
  schedule:
    # Runs Mon-Fri 23:30 UTC (= Tue-Sat 07:30 Beijing Time, after US market close & after-hours EPS)
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download market, earnings & Fed data
        run: python validation/download.py

      - name: Rebuild macro & earnings statistics
        run: |
          python validation/build_events.py
          python validation/analyze_events.py --no-plot
          python validation/analyze_earnings.py

      - name: Export web JSON datasets
        run: python scripts/export_web_data.py

      - name: Commit & push updated data (triggers Vercel auto-deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): daily market & earnings refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
